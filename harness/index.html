<!doctype html>
<html class="dark">
  <head>
    <meta charset="utf-8" />
    <title>telemetry harness</title>
    <!-- Default dark theme tokens as resolved by the desktop renderer (captured from :root). -->
    <style>
      :root {
        --ui-accent: #4a84fe;
        --ui-base: #e6edf3;
        --ui-text-primary: color-mix(in srgb, #e6edf3 94%, transparent);
        --ui-text-secondary: color-mix(in srgb, #e6edf3 74%, transparent);
        --ui-text-tertiary: color-mix(in srgb, #e6edf3 54%, transparent);
        --ui-text-quaternary: color-mix(in srgb, #e6edf3 36%, transparent);
        --ui-stroke-primary: color-mix(in srgb, #4a84fe 24%, color-mix(in srgb, #e6edf3 10%, transparent));
        --ui-stroke-secondary: color-mix(in srgb, #4a84fe 16%, color-mix(in srgb, #e6edf3 7%, transparent));
        --ui-stroke-tertiary: color-mix(in srgb, #4a84fe 10%, color-mix(in srgb, #e6edf3 5%, transparent));
        --ui-stroke-quaternary: color-mix(in srgb, #4a84fe 6%, color-mix(in srgb, #e6edf3 3%, transparent));
        --ui-control-active-background: color-mix(in srgb, #4a84fe 8%, color-mix(in srgb, #e6edf3 5%, transparent));
        --ui-red: #e75e78;
        --ui-yellow: #c08532;
        --ui-green: #55a583;
        --font-mono: Menlo, Monaco, 'SF Mono', monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; } /* the app's preflight */
      html, body { margin: 0; height: 100%; background: color-mix(in srgb, #010409 38%, #161618); font-family: var(--font-sans); }
      #app { display: grid; grid-template-rows: minmax(0, 1fr) 26px; height: 100vh; }
      #bar { display: flex; justify-content: flex-end; align-items: center; padding: 0 10px; border-top: 1px solid var(--ui-stroke-tertiary); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react/jsx-runtime": "/vendor/jsx-runtime.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "@hermes/plugin-sdk": "/harness/sdk-shim.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"><main id="root" style="min-height: 0"></main><footer id="bar"></footer></div>
    <script type="module">
      import { createRoot } from 'react-dom/client'
      import plugin from '/desktop/plugin.js'
      import { host } from '/harness/sdk-shim.js'

      const byArea = {}
      const disposers = []
      const events = new Set()
      const builtFiles = ['page', 'panel-throughput', 'panel-silicon', 'panel-thermal', 'panel-fleet', 'panel-wire', 'panel-memory', 'panel-net', 'panel-disk', 'panel-power']
      const params = new URLSearchParams(location.search)
      let configText = params.has('widgets') ? await (await fetch('/examples/dashboard.json')).text() : null
      if (params.get('widgets') === 'empty') configText = JSON.stringify({ version: 1, widgets: [] })
      if (params.get('widgets') === 'invalid') configText = '{invalid'
      let previewBuilt = !params.has('empty')
      const storage = new Map(previewBuilt ? [['buildDir', 'harness/monitoring-dashboard']] : [])
      // Preview the composed layout through the same disk-reconciliation seam,
      // without inventing gateway traffic or hardware readings.
      window.hermesDesktop = {
        readDir: async () => ({ entries: [...(previewBuilt ? builtFiles.map(file => ({ name: `${file}.html`, isDirectory: false })) : []), ...(configText !== null ? [{ name: 'dashboard.json', isDirectory: false }] : [])] }),
        readFileText: async () => ({ text: configText, binary: false, truncated: false }),
        trashPath: async () => { previewBuilt = false; configText = null }
      }
      const bar = createRoot(document.getElementById('bar'))
      const page = createRoot(document.getElementById('root'), { onUncaughtError: error => console.error(error.stack || String(error)) })
      const refreshBar = () => bar.render(byArea['statusbar.right']?.[0]?.render() ?? null)
      const register = c => {
        ;(byArea[c.area] ??= []).push(c)
        refreshBar()
        return () => {
          byArea[c.area] = byArea[c.area].filter(entry => entry !== c)
          refreshBar()
        }
      }
      const fixture = new URLSearchParams(location.search).get('fixture')
      if (fixture) document.title = `FIXTURE ${fixture} · telemetry harness`
      const ctx = {
        registerMany: cs => {
          const off = cs.map(register)
          return () => off.forEach(fn => fn())
        },
        register,
        storage: {
          get: (key, fallback) => storage.has(key) ? storage.get(key) : fallback,
          set: (key, value) => storage.set(key, value),
          remove: key => storage.delete(key)
        },
        setInterval: (fn, ms) => {
          const id = setInterval(fn, ms)
          return () => clearInterval(id)
        },
        onEvent: (_type, fn) => (events.add(fn), () => events.delete(fn)),
        onDispose: fn => disposers.push(fn),
        async rest(path, { timeoutMs = 10000 } = {}) {
          const query = fixture ? `?fixture=${encodeURIComponent(fixture)}` : ''
          const response = await fetch(`/api/plugins/${plugin.id}${path}${query}`, { signal: AbortSignal.timeout(timeoutMs) })
          if (!response.ok) throw new Error(`${response.status}: ${await response.text()}`)
          return response.json()
        }
      }
      plugin.register(ctx)
      page.render(byArea.routes[0].render())
      window.harness = {
        host,
        setConfig: value => { configText = value === null ? null : typeof value === 'string' ? value : JSON.stringify(value) },
        getConfig: () => configText,
        setMarkers: value => { previewBuilt = value },
        emit: event => events.forEach(fn => fn(event)),
        dispose: () => {
          disposers.forEach(fn => fn())
          page.unmount()
          bar.unmount()
          events.clear()
        }
      }
      if (new URLSearchParams(location.search).has('sim')) setTimeout(() => [...document.querySelectorAll('button')].find(b => /SIM/.test(b.textContent))?.click(), 300)
    </script>
  </body>
</html>
